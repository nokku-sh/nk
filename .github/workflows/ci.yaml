name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: nokku-sh/.github/.github/workflows/go-ci.yaml@main

  # The Secure Enclave bridge is Swift linked through cgo and only builds on
  # a Mac. Runners are VMs without an enclave, so the tests drive the bridge
  # with a software key.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/prepare

      - name: Build the Secure Enclave bridge
        run: ./internal/enclave/build.sh

      - name: Test
        run: |
          CGO_ENABLED=1 go test -race -count=1 -v -tags enclave ./internal/enclave/
          CGO_ENABLED=1 go test -race -count=1 -tags enclave ./...

      - name: Build
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH="$arch" go build -tags enclave -ldflags="-s -w" -o "bin/nk_darwin_$arch"
          done

      - name: Doctor
        run: NK_SECURE_ENCLAVE=1 ./bin/nk_darwin_arm64 doctor || true
