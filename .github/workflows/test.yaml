name: Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/enclave/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/enclave/**"
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"

      - name: Lint and test
        run: |
          go mod tidy
          go mod verify
          go fmt ./...
          go vet ./...
          go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

      - name: Build
        run: go build -ldflags="-s -w" -o bin/

  # The Secure Enclave bridge is Swift linked through cgo and only builds on
  # a Mac. Runners are VMs without an enclave, so the tests drive the bridge
  # with a software key.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"

      # The TPM simulator in the tests is cgo and needs OpenSSL headers, which
      # macOS only has through Homebrew.
      - name: Point cgo at Homebrew OpenSSL
        run: |
          prefix="$(brew --prefix openssl@3)"
          echo "CGO_CFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"

      - name: Build the Secure Enclave bridge
        run: ./internal/enclave/build.sh

      - name: Test
        run: |
          CGO_ENABLED=1 go test -race -count=1 -v -tags enclave ./internal/enclave/
          CGO_ENABLED=1 go test -race -count=1 -tags enclave ./...

      - name: Build
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH="$arch" go build -tags enclave -ldflags="-s -w" -o "bin/nk_darwin_$arch"
          done

      - name: Doctor
        run: NK_SECURE_ENCLAVE=1 ./bin/nk_darwin_arm64 doctor || true
