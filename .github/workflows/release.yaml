name: Release

on:
  # Uncomment both for weekly releases, and early ones when a sec commit lands on main.
  # schedule:
  #   - cron: "40 3 * * 5"
  push:
    # branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    uses: nokku-sh/.github/.github/workflows/go-release.yaml@main
    with:
      # A Mac, because the darwin binaries link the Swift Secure Enclave bridge.
      # It cross-builds every other target.
      runner: macos-latest
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
