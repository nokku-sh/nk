version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/nokku-sh/nk/internal/gen
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  - protoc_builtin: go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt:
      - paths=source_relative
      - simple
inputs:
  # Local checkout of the protos repo (../protos) so schema changes are
  # picked up without pushing to git first.
  - directory: ../protos/nokku
