version: 2
project_name: nk
report_sizes: true

before:
  hooks:
    - go fmt ./...
    - go vet ./...
    - go test ./...
    - go mod download
    - go mod verify

builds:
  - &build
    id: nk
    binary: "{{ .ProjectName }}"
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - riscv64

  # The Secure Enclave bridge is Swift linked through cgo, so the darwin
  # binaries only build on a Mac.
  - <<: *build
    id: nk-darwin
    env: [CGO_ENABLED=1]
    tags: [enclave]
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      pre: ./internal/enclave/build.sh
    skip: '{{ ne .Runtime.Goos "darwin" }}'

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

sboms:
  - cmd: syft
    documents:
      - "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    args:
      - "$artifact"
      - "--source-name={{ .ProjectName }}"
      - "--source-version={{ .Version }}"
      - "--select-catalogers=-file"
      - "--output"
      - "cyclonedx-json=$document"
    artifacts: binary

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - vendor: "MizuchiLabs"
    homepage: "https://github.com/nokku-sh/nk"
    description: "Nokku SSH companion"
    maintainer: "Nokku <support@mizuchi.dev>"
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  mode: append
