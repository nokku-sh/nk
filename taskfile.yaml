version: "3"

env:
  CGO_ENABLED: 0

tasks:
  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...

  gen:
    desc: Generate buf.build files
    cmds:
      - buf generate

  build:
    desc: Build binary
    cmds:
      - go build -ldflags="-s -w" -trimpath -o ~/.local/bin/

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - golines -w internal
      - govulncheck ./...
      - go test -cover ./...
      - golangci-lint run

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
